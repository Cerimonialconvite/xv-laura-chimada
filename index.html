<style>
  :root{ --papel:#fefefe; --ouro:#a8854b; --ouro-escuro:#8f6c35; --ouro-claro:#dcc69c; --rosa:#f1c3cc; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--papel)}
  body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ouro);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  #convite{max-width:540px;margin:0 auto;background:var(--papel);container-type:inline-size;position:relative}
  .faixa{position:relative;width:100%}
  .faixa canvas{display:block;width:100%;height:auto}
  .entra{opacity:0;transform:translateY(24px);transition:opacity 1.2s ease,transform 1.2s ease}
  .entra.visto{opacity:1;transform:none}


  /* textos animados ao rolar */
  .txt{position:absolute;display:block;height:auto;pointer-events:none;z-index:2}
  .fx-sobe,.fx-desce,.fx-esq,.fx-dir,.fx-zoom{opacity:0;filter:blur(3px);transition-property:opacity,transform,filter;transition-duration:1.4s;transition-timing-function:cubic-bezier(.25,.7,.25,1)}
  .fx-sobe{transform:translateY(16px)} .fx-desce{transform:translateY(-14px)} .fx-esq{transform:translateX(-26px)} .fx-dir{transform:translateX(26px)} .fx-zoom{transform:scale(1.14)}
  .fx-linha{transform:scaleX(0);opacity:0;transition:transform 1.6s cubic-bezier(.3,.7,.2,1),opacity .5s ease}
  .fx-escrita{opacity:.15;-webkit-mask-image:linear-gradient(90deg,#000 42%,transparent 58%);mask-image:linear-gradient(90deg,#000 42%,transparent 58%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0;transition:-webkit-mask-position 2.6s cubic-bezier(.45,.05,.3,1),mask-position 2.6s cubic-bezier(.45,.05,.3,1),opacity 1s ease}
  .txt.ve{opacity:1;transform:none;filter:none;-webkit-mask-position:0 0;mask-position:0 0}
  /* logo animado */
  #logo{position:absolute;left:16.02%;top:22.63%;width:70.93%;height:auto;overflow:visible;z-index:2}
  #logo-mono{opacity:0;filter:blur(6px);transform:scale(.96);transform-origin:44% 20%;transform-box:view-box;transition:opacity 1.8s ease,filter 1.8s ease,transform 2.2s cubic-bezier(.2,.7,.2,1)}
  #logo-xv{opacity:0;transition:opacity 1.4s ease}
  .logo-on #logo-mono{opacity:1;filter:blur(0);transform:none}
  .logo-on #logo-xv{opacity:1;transition-delay:2.6s}

  /* pontos clicáveis */
  .ponto{position:absolute;width:21.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;display:block;z-index:3}
  .ponto:focus-visible{outline:2px solid var(--ouro);outline-offset:4px}
  .ponto::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulso 2.4s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(201,168,90,0)}50%{box-shadow:0 0 26px 4px rgba(201,168,90,.25)}}

  /* calendário */
  .calendario{min-height:87.5cqw;background:url(img/arte-cal.jpg) center/100% 100% no-repeat;padding:2cqw 10cqw 7cqw;text-align:center;}
  .calendario>*{opacity:0;transform:translateY(20px);transition:opacity 1.2s ease,transform 1.2s ease}
  .calendario.revelada>*{opacity:1;transform:none}
  .calendario h2{font-family:"Pinyon Script",cursive;font-weight:400;font-size:13cqw;line-height:1.1;color:var(--ouro)}
  .calendario .ano{font-size:3.6cqw;letter-spacing:.42em;margin:.6cqw 0 4cqw;padding-left:.42em}
  .mes{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.4cqw}
  .mes .sem{font-size:2.9cqw;letter-spacing:.14em;padding:2cqw 0;border-top:1px solid var(--ouro-claro);border-bottom:1px solid var(--ouro-claro);margin-bottom:1.6cqw}
  .mes .dia{position:relative;font-size:4.7cqw;line-height:7.6cqw;font-variant-numeric:lining-nums tabular-nums;color:var(--ouro)}
  .mes .festa{color:var(--ouro-escuro);font-weight:500;isolation:isolate}
  .coracao{position:absolute;left:50%;top:50%;width:13.5cqw;height:13.5cqw;transform:translate(-50%,-52%);overflow:visible;pointer-events:none;z-index:-1}
  .coracao .preenche{fill:var(--rosa);opacity:0;transition:opacity 1.4s ease 1.6s}
  .coracao .traco{fill:none;stroke:#b8914f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:330;stroke-dashoffset:330;transition:stroke-dashoffset 1.9s cubic-bezier(.55,.1,.35,1) .5s}
  .revelada .coracao .traco{stroke-dashoffset:0}
  .revelada .coracao .preenche{opacity:.4}
  .contagem{margin-top:7cqw}
  .contagem h3{font-family:"Pinyon Script",cursive;font-weight:400;font-size:10cqw;line-height:1.1}
  .contagem p{font-size:3.1cqw;letter-spacing:.2em;text-transform:uppercase;margin-top:.4cqw}
  .relogio{display:flex;justify-content:center;gap:3cqw;margin-top:4.5cqw}
  .unidade{flex:1;max-width:17cqw;padding:2.6cqw 0 2cqw;border-top:1px solid var(--ouro-claro);border-bottom:1px solid var(--ouro-claro)}
  .unidade b{display:block;font-weight:400;font-size:8.6cqw;line-height:1;font-variant-numeric:lining-nums tabular-nums}
  .unidade small{display:block;margin-top:1.4cqw;font-size:2.5cqw;letter-spacing:.2em;text-transform:uppercase}
  .chegou{display:none;margin-top:4cqw;font-family:"Pinyon Script",cursive;font-size:9cqw}

  /* borboletas */
  #borboletas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  /* confirmação (Forms embutido) */
  #rsvp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(80,55,40,.35)}
  #rsvp.aberto{display:flex}
  #rsvp .janela{position:relative;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));background:var(--papel)}
  #rsvp iframe{width:100%;height:100%;border:0}
  #rsvp button{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ouro-claro);background:rgba(254,254,254,.92);color:var(--ouro);font-size:22px;line-height:1;cursor:pointer}
</style>

<script>
(function(){
  var FORMS='{{FORMS_URL}}';           // link do Google Forms (com ?embedded=true)
  var DATA_FESTA='2027-01-29T21:00:00-03:00';
  var semMovimento=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LARG=1080, imagens={};

  /* ---------- faixas com fade subindo ---------- */
  function carregar(src){ if(!imagens[src]){ imagens[src]=new Promise(function(ok){ var i=new Image(); i.onload=function(){ ok(i); }; i.src=src; }); } return imagens[src]; }
  var faixas=[].slice.call(document.querySelectorAll('.faixa'));
  faixas.forEach(function(f,i){
    var h=+f.dataset.h, c=document.createElement('canvas');
    c.width=LARG; c.height=h; f.style.aspectRatio=LARG+' / '+h;
    f.insertBefore(c,f.firstChild); f._canvas=c;
    carregar(f.dataset.img);
  });
  function desenha(f){ return carregar(f.dataset.img).then(function(img){ f._canvas.getContext('2d').drawImage(img,0,0); }); }
  function revelar(f){ if(f._feito) return; f._feito=true; desenha(f).then(function(){ f.classList.add('visto'); }); }

  /* ---------- logo ---------- */
  var cab=faixas[0];
  desenha(cab).then(function(){
    requestAnimationFrame(function(){ cab.classList.add('logo-on'); });
    var ret=document.getElementById('corte-ret'), luz=document.getElementById('ouro');
    if(semMovimento){ ret.setAttribute('width',1300); return; }
    var t0=null;
    function anima(t){
      if(t0===null) t0=t; var s=(t-t0)/1000;
      var p=Math.min(1,Math.max(0,(s-1.1)/2.2)); p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      ret.setAttribute('width',(p*1300).toFixed(1));
      var b=((s-3.4)%9+9)%9, x=-1400+Math.min(1,b/2.6)*2900;   // brilho dourado discreto, a cada 9 s
      luz.setAttribute('gradientTransform','translate('+x.toFixed(0)+' 0)');
      requestAnimationFrame(anima);
    }
    requestAnimationFrame(anima);
  });

  /* ---------- calendário janeiro/2027 ---------- */
  var mes=document.getElementById('mes'), html='';
  ['D','S','T','Q','Q','S','S'].forEach(function(d){ html+='<div class="sem">'+d+'</div>'; });
  var inicio=new Date(2027,0,1).getDay();
  for(var i=0;i<inicio;i++) html+='<div></div>';
  for(var d=1;d<=31;d++){
    if(d===29) html+='<div class="dia festa">29<svg class="coracao" viewBox="0 0 100 100" aria-hidden="true">'+

    else html+='<div class="dia">'+d+'</div>';
  }
  mes.innerHTML=html;

  /* ---------- contagem ---------- */
  var alvo=new Date(DATA_FESTA).getTime(), dois=function(n){ return (n<10?'0':'')+n; };
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ document.getElementById('relogio').style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    document.getElementById('d').textContent=Math.floor(s/86400);
    document.getElementById('h').textContent=dois(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=dois(Math.floor(s%3600/60));
    document.getElementById('s').textContent=dois(s%60);
    setTimeout(atualiza,1000);
  })();

  /* ---------- entrada ao rolar ---------- */
  var cal=document.querySelector('.calendario');
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(es){ es.forEach(function(e){
      if(!e.isIntersecting) return;
      if(e.target===cal) cal.classList.add('revelada'); else revelar(e.target);
      obs.unobserve(e.target);
    }); },{threshold:0.12});
    faixas.slice(1).forEach(revelar); obs.observe(cal);
  } else { faixas.forEach(revelar); cal.classList.add('revelada'); }

  /* ---------- confirmação ---------- */
  var modal=document.getElementById('rsvp'), frame=document.getElementById('rsvp-frame');
  document.getElementById('abrir-rsvp').addEventListener('click',function(e){
    e.preventDefault(); if(!FORMS||FORMS.indexOf('{{')===0) return;
    if(!frame.src) frame.src=FORMS; modal.classList.add('aberto');
  });
  document.getElementById('fechar-rsvp').addEventListener('click',function(){ modal.classList.remove('aberto'); });

  var textos=[].slice.call(document.querySelectorAll('.txt'));
  function mostrarTexto(el){ var g=el.dataset.g; (g?textos.filter(function(o){ return o.dataset.g===g; }):[el]).forEach(function(o){ o.classList.add('ve'); }); }
  if(semMovimento||!('IntersectionObserver' in window)) textos.forEach(function(o){ o.classList.add('ve'); });
  else { var obsT=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ mostrarTexto(e.target); obsT.unobserve(e.target); } }); },{rootMargin:'0px 0px -14% 0px',threshold:.6});
    textos.forEach(function(o){ obsT.observe(o); }); }
  /* ---------- borboletas ---------- */
  if(semMovimento) return;
  var cv=document.getElementById('borboletas'), x=cv.getContext('2d'), DPR=Math.min(2,window.devicePixelRatio||1);
  var W,H,colX,colW;
  function medir(){
    W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    var r=document.getElementById('convite').getBoundingClientRect(); colX=r.left; colW=r.width;
  }
  medir(); addEventListener('resize',medir);
  var IMGS=['img/borboleta1.webp','img/borboleta2.webp'].map(function(s){ var i=new Image(); i.src=s; return i; });
  var MAX=3, bs=[], sp=[], R=function(a,b){ return a+Math.random()*(b-a); }, TAU=Math.PI*2;
  function ang(d){ while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU; return d; }
  /* as maiores ficam nas laterais (nunca no centro); as menores podem cruzar */
  function pontoNovo(b){
    var fx=b.grande?(b.lado<0?R(.03,.24):R(.76,.97)):R(.1,.9);
    b.tx=colX+fx*colW; b.ty=R(.1,.88)*H; b.tempoAlvo=R(3,7);
  }
  function sombraDe(img){
    if(img._sombra) return img._sombra;
    var iw=img.naturalWidth, ih=img.naturalHeight, p=4;
    var a=document.createElement('canvas'); a.width=Math.ceil(iw/14); a.height=Math.ceil(ih/14);
    var g=a.getContext('2d'); g.drawImage(img,0,0,a.width,a.height);
    g.globalCompositeOperation='source-in'; g.fillStyle='#6b4334'; g.fillRect(0,0,a.width,a.height);
    var c=document.createElement('canvas'); c.width=Math.ceil(iw/p); c.height=Math.ceil(ih/p);
    var k=c.getContext('2d'); k.imageSmoothingQuality='high';
    if('filter' in k){ k.filter='blur(3px)'; }
    k.drawImage(a,0,0,c.width,c.height);
    return img._sombra=c;
  }
  function asas(src,sw,sh,w,h,we,wd,o){
    var bs2=sw*.035, bd=w*.035, dy=-h/2+(1-o)*h*.04;
    x.drawImage(src,0,0,sw/2-bs2,sh,-bd-we,dy,we,h);
    x.drawImage(src,sw/2+bs2,0,sw/2-bs2,sh,bd,dy,wd,h);
    x.drawImage(src,sw/2-bs2,0,2*bs2,sh,-bd,-h/2,2*bd,h);
  }
  function nascer(lado){
    if(bs.length>=MAX) return;
    var z=R(.35,1), esq=lado?lado<0:Math.random()<.5;
    var b={grande:z>.6, lado:esq?-1:1, img:IMGS[Math.random()<.5?0:1], z0:z, z:z, zf:R(.05,.12), zp:R(0,TAU),
      x:esq?colX-80:colX+colW+80, y:R(.2,.8)*H, a:esq?R(-.6,.3):Math.PI+R(-.3,.6),
      th:R(0,TAU), hz:R(2.1,2.9), ciclos:Math.round(R(3,6)), plana:0, vidaMax:R(16,28), vida:0, sai:false,
      volta:0, banco:0, n1:R(0,99), n2:R(0,99), sobe:0, vel:0};
    b.rot=b.a; pontoNovo(b); bs.push(b);
  }
  /* abertura das asas vista de cima: subida lenta (asas fecham), descida rápida (asas abrem) */
  function abertura(th){
    var u=(th%TAU)/TAU;
    if(u<.58){ var e=u/.58; e=e*e*(3-2*e); return 1-.84*e; }
    var d=(u-.58)/.42; d=1-Math.pow(1-d,2.6); return .16+.84*d;
  }
  function desenhar(b,o){
    var img=b.img; if(!img.complete||!img.naturalWidth) return;
    var iw=img.naturalWidth, ih=img.naturalHeight, esc=.55+.45*b.z;
    var w=colW*.21*esc, h=w*ih/iw, meia=w/2-w*.035;
    var we=meia*o*(1+b.banco), wd=meia*o*(1-b.banco);
    var bob=-Math.sin(b.th)*h*.035, giro=b.rot+Math.PI/2+Math.sin(b.th)*.035;
    /* sombra no papel: quanto mais perto (maior), mais alta voa e mais longe fica a sombra */
    var sm=sombraDe(img), alt=w*(.22+.35*b.z);
    x.save(); x.globalAlpha=.10+.06*b.z; x.translate(b.x+alt*.55,b.y+alt*1.05); x.rotate(giro); x.scale(1.08,1.08);
    asas(sm,sm.width,sm.height,w,h,we,wd,o); x.restore();
    x.save(); x.globalAlpha=.72+.28*b.z; x.translate(b.x,b.y+bob); x.rotate(giro);
    asas(img,iw,ih,w,h,we,wd,o); x.restore();
  }
  function brilho(p){
    x.save(); x.globalAlpha=Math.max(0,p.l/p.m)*.5; x.fillStyle=p.c; x.translate(p.x,p.y); var r=p.r; x.beginPath();
    x.moveTo(0,-r); x.quadraticCurveTo(0,0,r,0); x.quadraticCurveTo(0,0,0,r); x.quadraticCurveTo(0,0,-r,0); x.quadraticCurveTo(0,0,0,-r); x.fill(); x.restore();
  }
  var ultimo=scrollY, acum=0;
  addEventListener('scroll',function(){
    var dy=scrollY-ultimo; ultimo=scrollY; acum+=Math.abs(dy);
    bs.forEach(function(b){ var k=.12+.22*b.z; b.y-=dy*k; b.ty-=dy*k; }); sp.forEach(function(p){ p.y-=dy*.2; });
    if(acum>H*.6){ acum=0; nascer(); }
  },{passive:true});
  setTimeout(function(){ nascer(1); },1300); setTimeout(function(){ nascer(-1); },4800);
  var tAnt=null, tempo=0, ocioso=0;
  function loop(t){
    var dt=tAnt===null?1/60:Math.min(.05,(t-tAnt)/1000); tAnt=t; tempo+=dt;
    x.clearRect(0,0,W,H);
    if((ocioso+=dt)>8){ ocioso=0; if(bs.length<2) nascer(); }
    bs.forEach(function(b){
      b.vida+=dt;
      b.z=Math.max(.3,Math.min(1,b.z0+Math.sin(tempo*b.zf*TAU+b.zp)*.12));
      if(!b.sai&&b.vida>b.vidaMax){ b.sai=true; b.tx=b.x<colX+colW/2?colX-160:colX+colW+160; b.ty=b.y+R(-.2,.1)*H; }
      if(!b.sai&&((b.tempoAlvo-=dt)<0||Math.hypot(b.tx-b.x,b.ty-b.y)<colW*.08)) pontoNovo(b);
      /* rumo: alvo + ruído suave (nada de linha reta) */
      var desejado=Math.atan2(b.ty-b.y,b.tx-b.x)
        +(Math.sin(tempo*.9+b.n1)*.55+Math.sin(tempo*2.3+b.n2)*.25)*(b.grande?.6:1);
      if(b.grande&&!b.sai){ var meio=colX+colW/2, lim=colW*.27, dc=b.x-meio;
        if(Math.abs(dc)<lim) desejado=Math.atan2(Math.sin(desejado)*.6,(dc<0?-1:1)); }
      var curva=Math.max(-1.6,Math.min(1.6,ang(desejado-b.a)*1.4))*(b.plana>0?.45:1);
      b.a+=curva*dt;
      b.banco+=((Math.max(-.28,Math.min(.28,-curva*.22)))-b.banco)*Math.min(1,dt*5);
      b.rot+=ang(b.a-b.rot)*Math.min(1,dt*3.2);
      var o, base=colW*(.07+.06*b.z);
      if(b.plana>0){
        b.plana-=dt; o=.93+Math.sin(tempo*9+b.n1)*.025;
        b.vel+=(base*.75-b.vel)*dt*.8; b.sobe+=(-base*.10-b.sobe)*dt*2;
        if(b.plana<=0){ b.ciclos=Math.round(R(2,6)); b.hz=R(2.1,3.1); }
      } else {
        var ant=b.th; b.th+=b.hz*TAU*dt; o=abertura(b.th);
        var u=(b.th%TAU)/TAU, imp=u>.58?.9:-.25;            /* descida da asa empurra para cima */
        b.vel+=(base*1.1-b.vel)*dt*1.6; b.sobe+=(base*.20*imp-b.sobe)*dt*6;
        if(Math.floor(b.th/TAU)>Math.floor(ant/TAU)&&--b.ciclos<=0){ b.plana=R(.5,1.5); b.th=0; }
      }
      b.x+=Math.cos(b.a)*b.vel*dt; b.y+=Math.sin(b.a)*b.vel*dt-b.sobe*dt;
      b._o=o;
      if(Math.random()<dt*2.2) sp.push({x:b.x+R(-8,8),y:b.y+R(-8,8),r:R(.8,1.8),l:1.3,m:1.3,c:Math.random()<.65?'#d4ae5a':'#f3cbd6'});
    });
    bs=bs.filter(function(b){ return b.x>colX-260&&b.x<colX+colW+260&&b.y>-260&&b.y<H+260; });
    sp.forEach(function(p){ p.l-=dt; p.y+=6*dt; brilho(p); }); sp=sp.filter(function(p){ return p.l>0; });
    bs.sort(function(a,b){ return a.z-b.z; }).forEach(function(b){ desenhar(b,b._o); });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',function(){ tAnt=null; });
})();

</script>
